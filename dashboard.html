<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Crest Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <nav class="bar">
    <div class="brand">
      <span class="brand-mark">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      </span>
      <span class="brand-name font-display">Crest Academy</span>
    </div>
    
    <div class="mobile-controls">
      <button class="theme-toggle" id="themeToggleDesk" aria-label="Toggle theme">
        <svg class="sun-icon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="4.22" x2="19.78" y2="5.64"></line></svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button id="logoutBtn" class="btn btn-ghost btn-small">Log out</button>
    </div>
  </nav>
</header>

<main class="dashboard-main">
  <div class="wrap">
    <p class="eyebrow-label font-mono">DASHBOARD</p>
    <h2 class="font-display">Welcome, <span id="dash-name" class="gradient-text">Loading...</span></h2>
    
    <div class="card profile-card">
      <span class="icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </span>
      <h3 class="font-display">Your Profile Overview</h3>
      <div style="margin-top: 24px;">
        <p class="profile-item"><strong>Email:</strong> <span id="dash-email">...</span></p>
        <p class="profile-item"><strong>Role:</strong> <span id="dash-role">...</span></p>
      </div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script type="module" src="js/dashboard.js"></script>

</body>
</html>
